<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#081829"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background (Smooth Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Golden Tailor Scissors Icon in Center -->
  <g transform="translate(256, 210) scale(1.15)" filter="url(#shadow)">
    <!-- Scissor Loop 1 -->
    <circle cx="-60" cy="80" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    <!-- Scissor Loop 2 -->
    <circle cx="60" cy="80" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    
    <!-- Scissor Blade 1 -->
    <path d="M -45 50 L 55 -110 C 60 -120 70 -120 75 -110 L 15 20 Z" fill="url(#goldGrad)"/>
    <!-- Scissor Blade 2 -->
    <path d="M 45 50 L -55 -110 C -60 -120 -70 -120 -75 -110 L -15 20 Z" fill="url(#goldGrad)"/>

    <!-- Central Pivot Rivet -->
    <circle cx="0" cy="0" r="14" fill="#0F2942" stroke="url(#goldGrad)" stroke-width="6"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    KAPSE - G
  </text>
  
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" letter-spacing="3">
    TAILOR SHOP 🔰
  </text>
</svg>
